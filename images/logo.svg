<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DOMA-GB Solutions Logo">
  <defs>
    <linearGradient id="domaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4FA3"/>
      <stop offset="100%" stop-color="#1F6FB2"/>
    </linearGradient>
  </defs>

  <!-- Isotipo -->
  <g transform="translate(10,15)">
    <!-- Forma D -->
    <path d="M20 10
             H55
             C85 10 95 25 95 45
             C95 65 85 80 55 80
             H20
             Z"
          fill="url(#domaGradient)" />

    <!-- Líneas tipo circuito -->
    <circle cx="65" cy="30" r="3" fill="#6FB7A6"/>
    <circle cx="75" cy="45" r="3" fill="#6FB7A6"/>
    <circle cx="65" cy="60" r="3" fill="#6FB7A6"/>

    <line x1="55" y1="30" x2="65" y2="30" stroke="#6FB7A6" stroke-width="2"/>
    <line x1="55" y1="45" x2="75" y2="45" stroke="#6FB7A6" stroke-width="2"/>
    <line x1="55" y1="60" x2="65" y2="60" stroke="#6FB7A6" stroke-width="2"/>
  </g>

  <!-- Texto -->
  <g transform="translate(130,55)">
    <text x="0" y="0"
          font-size="36"
          font-weight="700"
          fill="#0B4FA3"
          font-family="Inter, Arial, sans-serif">
      DOMA-GB
    </text>

    <text x="0" y="32"
          font-size="16"
          font-weight="500"
          fill="#6FB7A6"
          letter-spacing="2"
          font-family="Inter, Arial, sans-serif">
      SOLUTIONS
    </text>
  </g>
</svg>
